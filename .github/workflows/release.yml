name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build SMB Folder Mapper
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --force

      - name: Init Tauri project
        run: cargo tauri init --force

      - name: Build Tauri application
        run: cargo tauri build --verbose

      - name: Rename binary to smb-folder-mapper.exe
        run: |
          if (Test-Path "src-tauri/target/release/app.exe") {
            Rename-Item "src-tauri/target/release/app.exe" "src-tauri/target/release/smb-folder-mapper.exe"
          }

      - name: Upload standalone .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: smb-folder-mapper-exe
          path: src-tauri/target/release/smb-folder-mapper.exe
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: src-tauri/target/release/smb-folder-mapper.exe
          name: smb-folder-mapper ${{ github.ref_name }}
          draft: false
          prerelease: false
