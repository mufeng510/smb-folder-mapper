<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMB Folder Mapper</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #f5f5f7;
      color: #333;
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }
    h1 {
      margin-top: 0;
      font-size: 20px;
      color: #1a1a1a;
    }
    p.sub { margin: 4px 0 22px; font-size: 13px; color: #666; }
    .field { margin-bottom: 20px; }
    .field label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 14px;
      color: #555;
    }
    .input-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .input-group.col { flex-direction: column; align-items: stretch; }
    input[type="text"],
    input[type="password"] {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #cfcfcf;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      background: #fff;
    }
    input:focus {
      border-color: #0078d4;
      box-shadow: 0 0 0 3px rgba(0, 120, 212, 0.12);
    }
    button.btn {
      padding: 10px 18px;
      border: 1px solid #cfcfcf;
      border-radius: 6px;
      background: #fff;
      color: #333;
      font-size: 14px;
      cursor: pointer;
    }
    button.btn:hover { background: #f4f4f4; }
    button.btn:disabled { opacity: 0.6; cursor: not-allowed; }
    button.primary {
      background: #0078d4;
      color: #fff;
      border-color: #0078d4;
    }
    button.primary:hover { background: #106ebe; }
    button.primary:disabled { opacity: 0.6; }
    .cred {
      border: 1px dashed #cfcfcf;
      border-radius: 8px;
      padding: 16px;
      margin-top: 8px;
      background: #fafafa;
    }
    .cred-title {
      font-weight: 600;
      margin-bottom: 10px;
      color: #555;
    }
    .row-actions {
      display: flex;
      gap: 12px;
      margin-top: 26px;
    }
    #status {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 6px;
      font-size: 14px;
      min-height: 24px;
      display: none;
      white-space: pre-wrap;
    }
    #status.ok {
      background: #e7f4ea;
      color: #1e7b34;
      border: 1px solid #b7e4cd;
      display: block;
    }
    #status.err {
      background: #fdecea;
      color: #c00000;
      border: 1px solid #f5b7b1;
      display: block;
    }
    .hint {
      font-size: 12.5px;
      color: #888;
      margin-top: 5px;
    }
    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid #e0e0e0;
      background: #fff;
    }
    .link-item:last-child { border-bottom: none; }
    .link-item .local-path {
      flex: 1;
      font-size: 13px;
      color: #333;
      word-break: break-all;
    }
    .link-item .unc-path {
      flex: 1;
      font-size: 12px;
      color: #666;
      margin-left: 12px;
      word-break: break-all;
      font-family: monospace;
    }
    .link-item .btn-remove {
      padding: 6px 12px;
      font-size: 12px;
      background: #fdecea;
      color: #c00000;
      border: 1px solid #f5b7b1;
      border-radius: 4px;
      cursor: pointer;
      margin-left: 10px;
      white-space: nowrap;
    }
    .link-item .btn-remove:hover { background: #f5b7b1; color: #a80000; }
    .link-item .btn-remove:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="container">
    <h1>SMB Folder Mapper</h1>
    <p class="sub">将局域网 SMB 共享作为目录符号链接挂载到本地文件夹（非网络盘符）。挂载完成后即可关闭，链接持久化，无后台残留。</p>

    <div class="field">
      <label>本地文件夹路径（空文件夹）</label>
      <div class="input-group">
        <input type="text" id="localPath" placeholder="例如 C:\LocalFolder" />
        <button class="btn" id="btnBrowse">浏览</button>
      </div>
      <div class="hint">必须为空文件夹，或不存在（其上级目录必须已存在）。</div>
    </div>

    <div class="field">
      <label>远程 SMB 路径（UNC）</label>
      <input type="text" id="uncPath" placeholder="例如 \\192.168.1.100\shared" />
      <div class="hint">UNC 共享路径，格式为 \\IP\ShareName。</div>
    </div>

    <div class="cred" id="credBox">
      <div class="cred-title">凭据（可选，写入 Windows 凭据管理器）</div>
      <div class="input-group col">
        <input type="text" id="credUser" placeholder="用户名（例如 DOMAIN\user 或 .\administrator）" />
        <input type="password" id="credPass" placeholder="密码" />
      </div>
      <label style="margin-top: 8px; font-size: 13px; cursor: pointer;">
        <input type="checkbox" id="chkSaveCred" checked />
        保存凭据到 Windows 凭据管理器（重启后自动鉴权）
      </label>
    </div>

    <div class="row-actions">
      <button class="btn primary" id="btnMount">挂载 / 创建链接</button>
      <button class="btn" id="btnUnmount">卸载 / 断开链接</button>
    </div>

    <div id="status"></div>

    <!-- 已创建的链接列表 -->
    <div class="field" style="margin-top: 26px;">
      <label style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-weight: 600; font-size: 14px; color: #555;">已创建的链接</span>
        <button class="btn" id="btnRefreshList" style="padding: 4px 10px; font-size: 13px;">刷新</button>
      </label>
      <div id="linkList" style="margin-top: 10px; max-height: 200px; overflow-y: auto; border: 1px solid #cfcfcf; border-radius: 6px; background: #fafafa;">
        <div id="linkListEmpty" style="padding: 16px; text-align: center; color: #888; font-size: 13px;">暂无已创建的链接</div>
      </div>
    </div>

  </div>

  <script type="importmap">
    {
      "imports": {
        "@tauri-apps/api": "./vendor/core.js"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
