[package]
name = "smb-folder-mapper"
version = "0.1.0"
edition = "2021"
description = "轻量级 SMB 文件夹目录符号链接映射工具（Tauri v2）"

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.12.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2.12.5", features = [] }

[target.'cfg(windows)'.dependencies]
